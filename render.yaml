services:
  # BVG ClinicOS Backend Web Service
  - type: web
    name: bvg-clinicos-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd backend && ./build.sh
    startCommand: cd backend && gunicorn clinic_os.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,.vercel.app,localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: bvg-clinicos-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: bvg-clinicos-db
    databaseName: bvg_clinicos
    user: bvg_admin
    region: oregon
    plan: free
